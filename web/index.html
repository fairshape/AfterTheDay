<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF5E7">
  <title>После дня</title>
  <link rel="stylesheet" href="/styles/tokens.css">
  <link rel="stylesheet" href="/styles/journal.css">
  <link rel="stylesheet" href="/styles/cover.css">
  <link rel="stylesheet" href="/styles/player.css">
  <link rel="stylesheet" href="/styles/motion.css">
  <script type="module" src="/scripts/journal.js"></script>
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <a class="wordmark" href="/" id="brand" aria-label="После дня — в дневник">
        <span class="brand-mark" aria-hidden="true"></span><span>После дня</span>
      </a>
      <span class="demo-label" id="demo-label" hidden>Демо</span>
      <button class="icon-button" type="button" id="search-toggle" aria-label="Поиск и фильтры" aria-expanded="false" hidden></button>

  <main id="journal" class="shell" aria-busy="true">
    <p role="status" class="page-status">Открываем дневник…</p>
  </main>
  <dialog class="sheet" id="sheet" aria-labelledby="sheet-title"></dialog>
  <dialog class="theater" id="theater" aria-label="Воспоминание"></dialog>
  <noscript>Включи JavaScript, чтобы открыть дневник.</noscript>

</html>
